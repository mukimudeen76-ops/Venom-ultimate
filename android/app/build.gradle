plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.novax.venom'
    compileSdk 34

    defaultConfig {
        applicationId "com.novax.venom"
        minSdk 26
        targetSdk 34
        // Version CI se aati hai (-PversionName / -PversionCode), local defaults yahan
        def vCodeProp = project.findProperty('versionCode')?.toString()
        def vNameProp = project.findProperty('versionName')?.toString()
        def vCode = (vCodeProp != null && vCodeProp.isInteger()) ? vCodeProp.toInteger() : 1
        def vName = (vNameProp != null && !vNameProp.isBlank()) ? vNameProp : "1.0.0"
        versionCode vCode
        versionName vName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            // VENOM real keystore — env vars se (CI/local). Default: debug keystore.
            def ksPath = System.getenv("VENOM_KEYSTORE_PATH")
            if (ksPath != null && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("VENOM_KEYSTORE_PASSWORD")
                keyAlias System.getenv("VENOM_KEY_ALIAS")
                keyPassword System.getenv("VENOM_KEY_PASSWORD")
                v1SigningEnabled true
                v2SigningEnabled true
            } else {
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.10'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Networking (for Gemini Live WebSockets)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Room for Memory
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:32.7.2')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'

    // Credential Manager for Google Sign In
    implementation 'androidx.credentials:credentials:1.2.1'
    implementation 'androidx.credentials:credentials-play-services-auth:1.2.1'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.0'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}

apply plugin: 'com.google.gms.google-services'

googleServices {
    disableVersionCheck = true
}
