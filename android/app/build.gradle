plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.novax.venom'
    compileSdk 34

    // Version comes from CI (-PversionName / -PversionCode), with local defaults.
    def vCodeProp = project.findProperty('versionCode')?.toString()
    def vNameProp = project.findProperty('versionName')?.toString()
    def vCode = (vCodeProp != null && vCodeProp.isInteger()) ? vCodeProp.toInteger() : 1
    def vName = (vNameProp != null && !vNameProp.isBlank()) ? vNameProp : "1.0.0"

    signingConfigs {
        release {
            // Secrets are injected by the CI workflow (keystore file + passwords).
            def ksPath = System.getenv("VENOM_KEYSTORE_PATH")
            if (ksPath != null && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("VENOM_KEYSTORE_PASSWORD")
                keyAlias System.getenv("VENOM_KEY_ALIAS")
                keyPassword System.getenv("VENOM_KEY_PASSWORD")
            }
        }
    }

    defaultConfig {
        applicationId "com.novax.venom"
        minSdk 26
        targetSdk 34
        versionCode vCode
        versionName vName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Update endpoint: default = public manifest mirror that the PRIVATE repo
        // auto-generates (release-mirror workflow). Owner can override to a
        // Cloudflare Worker URL via -PupdateEndpoint="..." at build time.
        def updateEndpoint = project.findProperty('updateEndpoint')?.toString()?.trim()
        buildConfigField "String", "UPDATE_ENDPOINT",
            "\"${updateEndpoint != null && updateEndpoint.length() > 0 ? updateEndpoint : "https://mukimudeen76-ops.github.io/VENOM-Website/venom-ultimate-update.json"}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def ksPath = System.getenv("VENOM_KEYSTORE_PATH")
            if (ksPath != null && file(ksPath).exists()) {
                signingConfig signingConfigs.release
            } else {
                // No keystore secret configured: fall back to debug signing so the
                // build still produces an installable APK.
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.10'
    }
}

googleServices {
    // Prevents the google-services plugin from eagerly resolving/observing
    // the compile classpath during its version-compatibility check, which
    // triggers "Cannot mutate the dependencies of configuration
    // ':app:releaseCompileClasspath' after the configuration was resolved"
    // on Gradle 8.7 with the credentials/googleid libraries in this project.
    disableVersionCheck = true
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Networking (for Gemini Live WebSockets)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Room for Memory
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:32.7.2')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'

    // Credential Manager for Google Sign In
    implementation 'androidx.credentials:credentials:1.2.1'
    implementation 'androidx.credentials:credentials-play-services-auth:1.2.1'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.0'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // WebViewAssetLoader: serves the bundled web app over https://appassets.androidplatform.net
    // (required for ES-module scripts + IndexedDB inside the WebView)
    implementation 'androidx.webkit:webkit:1.9.0'
}
