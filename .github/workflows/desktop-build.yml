name: Build VENOM Ultimate Desktop (EXE)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install & build web app
        shell: bash
        run: |
          for i in 1 2 3; do
            npm ci && break
            echo "npm ci attempt $i failed — retrying in 15s..."
            sleep 15
          done
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }} \
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }} \
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }} \
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }} \
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }} \
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }} \
          npm run build

      - name: Prepare desktop app & sync version from tag
        shell: bash
        run: |
          mkdir -p desktop/dist
          cp -r dist/* desktop/dist/
          rm -rf desktop/dist/vrm
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/v* ]]; then
            TAG="${REF#refs/tags/v}"
            node -e "const fs=require('fs');const p=require('./desktop/package.json');p.version='$TAG';fs.writeFileSync('./desktop/package.json',JSON.stringify(p,null,2));"
          fi

      - name: Install desktop build tools
        working-directory: desktop
        shell: bash
        run: |
          for i in 1 2 3 4; do
            npm install --no-audit --no-fund && break
            echo "desktop npm install attempt $i failed — retrying in 20s..."
            sleep 20
          done

      - name: Build portable EXE
        working-directory: desktop
        run: npx electron-builder --win portable --publish never

      - name: Upload EXE Artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: venom-ultimate-desktop-exe
          path: desktop/release/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/*.exe
          name: VENOM ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
