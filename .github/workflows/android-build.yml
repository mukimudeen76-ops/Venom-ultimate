name: Build Native Android APK (VENOM Ultimate)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Inject Google Services Configuration
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json
          elif [ -f "android/app/google-services.json" ]; then
            echo "Found existing android/app/google-services.json"
          elif [ -f "app/google-services.json" ]; then
            cp app/google-services.json android/app/google-services.json
          fi

      - name: Decode signing keystore (from secrets)
        shell: bash
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/venom-release.jks
            echo "VENOM_KEYSTORE_PATH=venom-release.jks" >> "$GITHUB_ENV"
            echo "VENOM_KEYSTORE_PASSWORD=${{ secrets.VENOM_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "VENOM_KEY_ALIAS=${{ secrets.VENOM_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "VENOM_KEY_PASSWORD=${{ secrets.VENOM_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Compute version from ref
        id: version
        shell: bash
        run: |
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/v* ]]; then
            TAG="${REF#refs/tags/v}"
            IFS='.' read -r MAJ MIN PAT <<< "$TAG"
            echo "name=$TAG" >> "$GITHUB_OUTPUT"
            echo "code=$(( MAJ * 10000 + MIN * 100 + PAT ))" >> "$GITHUB_OUTPUT"
          else
            echo "name=1.0.0" >> "$GITHUB_OUTPUT"
            echo "code=100" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Release APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew assembleRelease --no-daemon -PversionName="${{ steps.version.outputs.name }}" -PversionCode=${{ steps.version.outputs.code }}
          else
            # wrapper jar missing — use system gradle if available, else fail with clear msg
            if command -v gradle > /dev/null 2>&1; then
              gradle :app:assembleRelease --no-daemon -PversionName="${{ steps.version.outputs.name }}" -PversionCode=${{ steps.version.outputs.code }}
            else
              echo "::error::gradle-wrapper.jar missing aur system gradle nahi mila. Gradle 8.7 install karke wrapper fix karo."
              exit 1
            fi
          fi

      - name: Upload APK Artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: venom-ultimate-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          name: VENOM Ultimate ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
